name: Update visitor stats

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, and 18:00 IST.
    - cron: "30 18,0,6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-visitors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch visitor stats
        run: python visitors.py

      - name: Commit visitor stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add visitors.csv
          git commit -m "Update visitor stats - $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')" || echo "No changes to commit"
          git push
